<!DOCTYPE html>
<html>
<head>
  <script>
    fetch("https://ipapi.co/json/")
      .then(response => response.json())
      .then(data => {
        if (data.country === "BR") {
          window.location.href = "https://apextry.com/go/xvasoubot";
        } else {
          window.location.href = "https://t.me/couplesvipsbot";
        }
      })
      .catch(() => {
        // fallback (se der erro)
        window.location.href = "https://t.me/couplesvipsbot";
      });
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
