<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecionando...</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #080808; color: #f5f5f5; }
    main { width: min(92vw, 420px); text-align: center; }
    a, button { display: block; width: 100%; box-sizing: border-box; margin-top: 12px; padding: 14px 18px; border-radius: 12px; border: 0; background: #22c55e; color: #06130b; font-size: 16px; font-weight: 800; text-decoration: none; cursor: pointer; }
    .secondary { background: #1f2937; color: #f5f5f5; }
    p { color: #b8b8b8; line-height: 1.45; }
  </style>
  <script>
    const destinations = {
      BR: { user: "casaisvippbot", link: "https://t.me/casaisvippbot" },
      INTERNATIONAL: { user: "parejasvip_Bot", link: "https://t.me/parejasvip_Bot" }
    };
    let selectedDestination = null;
    let detectionInProgress = false;

    async function fetchCountry(url, parseResponse) {
      const controller = new AbortController();
      const timeout = window.setTimeout(() => controller.abort(), 5000);
      try {
        const response = await fetch(url, {
          cache: "no-store",
          signal: controller.signal
        });
        if (!response.ok) throw new Error("Country lookup failed");
        const country = (await parseResponse(response)).trim().toUpperCase();
        if (!/^[A-Z]{2}$/.test(country)) throw new Error("Invalid country code");
        return country;
      } finally {
        window.clearTimeout(timeout);
      }
    }

    async function getVisitorCountry() {
      try {
        return await fetchCountry(
          "https://ipapi.co/country/",
          response => response.text()
        );
      } catch (primaryError) {
        return await fetchCountry(
          "https://ipwho.is/",
          async response => {
            const data = await response.json();
            if (!data.success || typeof data.country_code !== "string") {
              throw new Error("Secondary country lookup failed");
            }
            return data.country_code;
          }
        );
      }
    }

    async function detectCountryAndRedirect() {
      if (detectionInProgress) return;
      detectionInProgress = true;

      const telegramLink = document.getElementById("telegramLink");
      const description = document.getElementById("description");
      const copyButton = document.getElementById("copyButton");
      telegramLink.textContent = "Identificando país...";
      description.textContent = "Aguarde enquanto identificamos sua localização.";
      copyButton.textContent = "Aguarde...";

      try {
        const country = await getVisitorCountry();
        selectedDestination = country === "BR"
          ? destinations.BR
          : destinations.INTERNATIONAL;

        telegramLink.href = selectedDestination.link;
        telegramLink.onclick = null;
        telegramLink.textContent = "Abrir no Telegram";
        description.innerHTML = "Se ficar carregando, toque no botão abaixo ou pesquise por <strong>@" + selectedDestination.user + "</strong> no Telegram.";
        copyButton.textContent = "Copiar @" + selectedDestination.user;

        if (country === "BR") {
          window.location.href = "tg://resolve?domain=" + selectedDestination.user;
          window.setTimeout(() => window.location.replace(selectedDestination.link), 1200);
        } else {
          window.location.replace(selectedDestination.link);
        }
      } catch (error) {
        selectedDestination = null;
        telegramLink.href = "#";
        telegramLink.textContent = "Tentar identificar novamente";
        telegramLink.onclick = (event) => {
          event.preventDefault();
          detectionInProgress = false;
          detectCountryAndRedirect();
        };
        description.textContent = "Não foi possível identificar seu país. Para evitar abrir o bot errado, tente novamente.";
        copyButton.textContent = "País não identificado";
        document.getElementById("copyText").textContent = "";
        detectionInProgress = false;
      }
    }

    window.addEventListener("load", detectCountryAndRedirect);

    function copyUser() {
      if (!selectedDestination) {
        document.getElementById("copyText").textContent = "Identifique seu país antes de copiar o usuário.";
        return;
      }
      navigator.clipboard?.writeText("@" + selectedDestination.user);
      document.getElementById("copyText").textContent = "Usuário copiado: @" + selectedDestination.user;
    }
  </script>
</head>
<body>
  <main>
    <h1>Abrindo o Telegram...</h1>
    <p id="description">Identificando seu país...</p>
    <a id="telegramLink" href="#" onclick="return false;">Identificando país...</a>
    <button id="copyButton" class="secondary" onclick="copyUser()" type="button">Aguarde...</button>
    <p id="copyText"></p>
  </main>
</body>
</html>
